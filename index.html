<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Cards</title>
    <meta name="author" content="Alissa Passmore" />
    <meta name="keywords" content="flashcards, learning tools, study aids" />
    <meta
      name="description"
      content="Flash Cards is a study aid website that utilizes the assistance of flash cards for fact memorization."
    />
    <link rel="favicon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/css/index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="index.html">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="#home">My Decks</a></li>
          <li><a class="nav__link" href="#about">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section id="home" class="gallery">
        <h2 class="gallery__title">My Decks</h2>
        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents">
            <template id="deck-template">
              <li class="card card_color_green">
                <a class="card__link" href="#"></a>
                <h3 class="card__title"></h3>
                <div class="card__row">
                  <span class="card__count"></span>
                  <button
                    type="button"
                    aria-label="Delete deck"
                    class="card__delete-btn"
                  >
                    <img src="assets/images/delete.svg" alt="trash can" />
                  </button>
                </div>
              </li>
            </template>
          </ul>
          <button class="gallery__new-card-btn gallery__new-btn" type="button">
            + New Deck
          </button>
        </div>
      </section>

      <section id="deck-view" class="gallery">
        <div class="gallery__wrapping-row">
          <h2 class="gallery__title"></h2>
          <button type="button" class="gallery__practice-btn">
            Practice
          </button>
        </div>
        <div class="wrapping-row">
          <ul class="gallery__list wrapping-row__display-contents">
            <template id="card-template">
              <li class="card">
                <h3 class="card__title"></h3>
                <div class="card__row">
                  <button
                    type="button"
                    aria-label="Flip the card"
                    class="card__flip-btn"
                  >
                    <img src="assets/images/flip.svg" alt="" />
                  </button>
                  <button
                    type="button"
                    aria-label="Delete card"
                    class="card__delete-btn"
                  >
                    <img src="assets/images/delete.svg" alt="" />
                  </button>
                </div>
              </li>
            </template>
          </ul>
          <button class="gallery__new-card-btn gallery__new-btn" type="button">
            + New Card
          </button>
        </div>
      </section>

     <!--The project states to delete the carousel.html and paste the contents here.-->
     <!--See Task 6 of the project instructions-->
      <section id="carousel" class="carousel">
        <h2 class="carousel__title">
          HTML Tags Deck &middot; 1/10</h2>
        <div class="carousel__grid"> 
          <button
              type="button"
              aria-label="Go to previous card in deck"
              class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            ></button>
          <div class="carousel__card">
            <span class="carousel__card-text">&lt;body&gt;/body&gt;</span>
          </div>  
            <button
              type="button"
              aria-label="Go to next card in deck"
              class="carousel__btn carousel__btn_type_right"
            ></button>
            <button
              type="button"
              aria-label="Flip current card over"
              class="carousel__btn carousel__btn_type_flip"
            ></button>
          </div>
      </section>

      <section id="new-deck-view" class="new-deck-view">
        <h2 class="new-deck-view__title">New Deck</h2>
        <form class="new-deck-view__form" id="new-deck-form">
          <fieldset class="new-deck-view__color-fieldset">
          <legend class="new-deck-view__legend">Pick the deck color</legend>

          <div class="new-deck-view__color-options">
          <label class="new-deck-view__color-label" for="green">
             <input
            class="new-deck-view__color_input new-deck-view__color_input_type_green"
            aria-label="Green"
            type="radio"
            name="deck-color"
            id="green"
            value="#64D583"
            checked
          />
          </label>

          <label class="new-deck-view__color-label" for="blue">
             <input
            class="new-deck-view__color_input new-deck-view__color_input_type_blue"
            aria-label="Blue"
            type="radio"
            name="deck-color"
            id="blue"
            value="#91A8F9"
          />
          </label>

          <label class="new-deck-view__color-label" for="purple">
             <input
            class="new-deck-view__color_input new-deck-view__color_input_type_purple"
            aria-label="Purple"
            type="radio"
            name="deck-color"
            id="purple"
            value="#AA8EF0"
          />
          </label>

          <label class="new-deck-view__color-label" for="pink">
             <input
            class="new-deck-view__color_input new-deck-view__color_input_type_pink"
            aria-label="Pink"
            type="radio"
            name="deck-color"
            id="pink"
            value="#EE92D7" 
          />  
          </label>

          <label class="new-deck-view__color-label" 
            for="orange">
             <input
            class="new-deck-view__color_input new-deck-view__color_input_type_orange"
            aria-label="Orange"
            type="radio"
            name="deck-color"
            id="orange"
            value="#EE955E"
          />
          </label>

          <label class="new-deck-view__color-label" for="yellow">
             <input
            class="new-deck-view__color_input new-deck-view__color_input_type_yellow"
            aria-label="Yellow"
            type="radio"
            name="deck-color"
            id="yellow"
            value="#F5D770"
          />
          </label>
          </div>

          <label class="new-deck-view__text_title">Write the JSON array of cards so that it matches this schema
            <textarea 
            class="new-deck-view__text"
            name="deck-text" 
            id="deck-text" 
            placeholder="{
              name: Deck Name,
              cards: [
                {
                  questions: Question?,
                  answer: Answer.
                },
                ...
              ]
            }" 
            required
            ></textarea>
          </label>

          <button type="submit" class="new-deck-view__submit-btn" disabled>Create the Deck</button>
        </fieldset>
        </form>
        </section>

      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Sorry, nothing found!</p>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy;2026 Alissa Passmore</p>
    </footer>
    <script src="./assets/js/index.js" type="module"></script>
  </body>
</html>
