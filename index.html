<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flash Cards</title>
    <meta name="author" content="Alissa Passmore" />
    <meta name="keywords" content="flashcards, learning tools, study aids" />
    <meta
      name="description"
      content="Flash Cards is a study aid website that utilizes the assistance of flash cards for fact memorization."
    />
    <link rel="favicon" href="favicon.ico" />
    <link rel="stylesheet" href="assets/vendor/normalize.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="page">
    <header class="header">
      <h1 class="header__title">
        <a class="header__link" href="index.html">Flash Cards</a>
      </h1>
      <nav class="nav">
        <ul class="nav__links">
          <li><a class="nav__link" href="#home">My Decks</a></li>
          <li><a class="nav__link" href="#about">About</a></li>
        </ul>
      </nav>
    </header>
    <main class="page__main-content">
      <section id="home" class="decks">
        <h2 class="decks__title">My Decks</h2>
        <div class="wrapping-row">
          <ul class="decks__list wrapping-row__display-contents">
            <template id="deck-template">
              <li class="deck deck_color_green">
                <a class="deck__link" href="#"></a>
                <h3 class="deck__title"></h3>
                <div class="deck__row">
                  <span class="deck__count"></span>
                  <button
                    type="button"
                    aria-label="Delete this deck"
                    class="deck__delete-btn"
                  >
                    <img src="assets/images/delete.svg" alt="trash can" />
                  </button>
                </div>
              </li>
            </template>
          </ul>
          <button class="decks__new-deck-btn" type="button">+ New Deck</button>
        </div>
      </section>

     <!--The project states to delete the carousel.html and paste the contents here.-->
     <!--See Task 6 of the project instructions-->
      <section id="carousel" class="carousel">
        <h2 class="carousel__title">
          HTML Tags Deck &middot; 1/10</h2>
        <div class="wrapper-row"> 
          <button
              type="button"
              aria-label="Go to previous card in deck"
              class="carousel__btn carousel__btn_type_left carousel__btn_disabled"
            ></button>
          <div class="carousel__card">
            <span class="carousel__card-text">&lt;body&gt;/body&gt;</span>
        </div>  
            <button
              type="button"
              aria-label="Go to next card in deck"
              class="carousel__btn carousel__btn_type_right"
            ></button>
        </div>
            <button
              type="button"
              aria-label="Flip current card over"
              class="carousel__btn carousel__btn_type_flip"
            ></button>
      </section>

      <section id="not-found" class="not-found">
        <h2 class="not-found__status-code">404</h2>
        <p class="not-found__text">Sorry, nothing found!</p>
      </section>
    </main>
    <footer class="footer">
      <p class="footer__text">&copy;2026 Alissa Passmore</p>
    </footer>
    <script src="./assets/js/index.js" type="module"></script>
  </body>
</html>
